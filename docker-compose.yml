services:
  postgres:
    image: postgres:16-alpine
    container_name: hsk-mind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hskmind
      POSTGRES_PASSWORD: hskmind
      POSTGRES_DB: hskmind
    ports:
      - "5432:5432"
    volumes:
      - hsk-mind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hskmind -d hskmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hsk-mind-postgres-data:
